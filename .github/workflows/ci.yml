name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native-zig:
    name: Native Zig Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Run Zig Native Unit Tests (portable kernels, Debug)
        run: zig build test --summary all

      - name: Run Zig Native Unit Tests (every instruction set level, optimized)
        run: zig build test -Doptimize=ReleaseFast --summary all

      - name: Run Command Line and Server End to End Tests
        run: zig build test-e2e -Doptimize=ReleaseFast --summary all

      - name: Run Unit Tests at Lower Instruction Set Levels (x86-64 only)
        if: runner.arch == 'X64'
        run: |
          zig build test -Doptimize=ReleaseFast -Dcpu=x86_64_v3 --summary all
          zig build test -Doptimize=ReleaseFast -Dcpu=x86_64 --summary all

      - name: Build C Dynamic Library
        run: zig build

      - name: Test Cross-Compilation Matrix (from Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          zig build -Dtarget=x86_64-linux -Doptimize=ReleaseFast
          zig build -Dtarget=aarch64-linux -Doptimize=ReleaseFast
          zig build -Dtarget=x86_64-windows -Doptimize=ReleaseFast
          zig build -Dtarget=aarch64-macos -Doptimize=ReleaseFast
          zig build -Dtarget=x86_64-macos -Doptimize=ReleaseFast
          zig build -Dtarget=aarch64-linux -Dcpu=generic+dotprod -Doptimize=ReleaseFast

  python-test-matrix:
    name: Python Tests (${{ matrix.os }} / Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Zig (for dynamic library build)
        uses: ./.github/actions/setup-zig

      - name: Build HK Native Engine
        run: |
          zig build -Doptimize=ReleaseFast
          python -c "import shutil, glob, os; [shutil.copy(f, 'python/hk/') for f in glob.glob('zig-out/lib/*') + glob.glob('zig-out/bin/*') if os.path.isfile(f)]"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel build pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy safetensors transformers gguf
          pip install -e .

      - name: Verify HK CLI
        run: |
          python -m hk.cli --help
          hk --help

      - name: Run Pytest Suite
        # Some hosted runners report CPU features their VM cannot execute, and PyTorch's oneDNN
        # kernels then die with an illegal instruction inside F.linear (seen on one Windows
        # runner, in a bf16/fp16 test that never touches HK code). Capping oneDNN's ISA avoids it.
        env:
          ONEDNN_MAX_CPU_ISA: AVX2
          DNNL_MAX_CPU_ISA: AVX2
        run: |
          pytest tests/ -v --durations=10

  multilingual-bindings:
    name: Language Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      # Builds libhk and libhkjni, writes a fixture through the C ABI, then runs the C, C++, Rust,
      # Go, C#, Java and TypeScript tests against it.
      - name: Run binding tests
        env:
          HK_BINDINGS_STRICT: '1'
        run: tests/bindings/run.sh
