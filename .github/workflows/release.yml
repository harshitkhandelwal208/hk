name: Release & Package Sync

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: 'Publish to PyPI'
        required: true
        type: boolean
        default: true
      publish_npm:
        description: 'Publish to NPM'
        required: true
        type: boolean
        default: true
      publish_crates:
        description: 'Publish to Crates.io'
        required: true
        type: boolean
        default: true
      publish_nuget:
        description: 'Publish to NuGet'
        required: true
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-native-binaries:
    name: Build Native Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            artifact_name: libhk-linux-x86_64.so
          - os: ubuntu-latest
            target: aarch64-linux
            artifact_name: libhk-linux-aarch64.so
          - os: windows-latest
            target: x86_64-windows
            artifact_name: hk.dll
          - os: macos-latest
            target: aarch64-macos
            artifact_name: libhk-macos-arm64.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Build Dynamic Library
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast

      - name: Prepare Named Artifact
        shell: bash
        run: |
          mkdir -p zig-out/staged
          if [ -f zig-out/lib/libhk.so ]; then
            cp zig-out/lib/libhk.so zig-out/staged/${{ matrix.artifact_name }}
          fi
          if [ -f zig-out/lib/libhk.dylib ]; then
            cp zig-out/lib/libhk.dylib zig-out/staged/${{ matrix.artifact_name }}
          fi
          if [ -f zig-out/bin/hk.dll ]; then
            cp zig-out/bin/hk.dll zig-out/staged/${{ matrix.artifact_name }}
            if [ -f zig-out/lib/hk.lib ]; then
              cp zig-out/lib/hk.lib zig-out/staged/hk.lib
            fi
          fi
          # The command line tool, which carries every instruction set level in one binary.
          if [ -f zig-out/bin/hk ]; then
            cp zig-out/bin/hk zig-out/staged/hk-${{ matrix.target }}
          fi
          if [ -f zig-out/bin/hk.exe ]; then
            cp zig-out/bin/hk.exe zig-out/staged/hk-${{ matrix.target }}.exe
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: zig-out/staged/*

  build-python-wheel:
    name: Build Multiplatform Python Wheels & Sdist
    needs: [build-native-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Download All Native Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: python/hk/

      - name: Ensure Generic Native Libs for Runtime
        shell: bash
        run: |
          cd python/hk
          if [ -f libhk-linux-x86_64.so ] && [ ! -f libhk.so ]; then
            cp libhk-linux-x86_64.so libhk.so
          fi
          if [ -f libhk-macos-arm64.dylib ] && [ ! -f libhk.dylib ]; then
            cp libhk-macos-arm64.dylib libhk.dylib
          fi
          ls -la

      - name: Build Source Distribution and Wheel
        run: python -m build

      - name: Upload Python Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  create-github-release:
    name: Create GitHub Release
    needs: [build-native-binaries, build-python-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidate Unique Release Assets
        shell: bash
        run: |
          mkdir -p release-files
          find release-artifacts -type f -exec cp -f {} release-files/ \;
          ls -la release-files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        continue-on-error: true

  publish-pypi:
    name: Publish to PyPI (pip)
    needs: [build-python-wheel]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    permissions:
      id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Download Python Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true

  publish-npm:
    name: Publish to NPM
    needs: [build-native-binaries]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Download Native Binaries for NPM
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: bindings/js/lib/

      - name: Ensure Generic Native Libs for NPM
        shell: bash
        run: |
          cd bindings/js/lib
          if [ -f libhk-linux-x86_64.so ] && [ ! -f libhk.so ]; then
            cp libhk-linux-x86_64.so libhk.so
          fi
          if [ -f libhk-macos-arm64.dylib ] && [ ! -f libhk.dylib ]; then
            cp libhk-macos-arm64.dylib libhk.dylib
          fi
          ls -la

      - name: Install Dependencies & Build TypeScript
        run: |
          cd bindings/js
          npm ci || npm install
          npm run build

      - name: Publish to NPM Registry
        run: |
          cd bindings/js
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

  publish-crates:
    name: Publish to Crates.io (Rust)
    needs: [build-native-binaries]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_crates)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to Crates.io
        run: |
          cd bindings/rust
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

  publish-nuget:
    name: Publish to NuGet (C#)
    needs: [build-native-binaries]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_nuget)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: NuGet Login (OIDC Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: harshitkhandelwal208
      - name: Build & Pack NuGet Package
        run: |
          cd bindings/csharp
          dotnet pack -c Release
          dotnet nuget push bin/Release/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true

  publish-java:
    name: Publish Java Package to GitHub Packages
    needs: [build-native-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}
      - name: Publish to GitHub Packages
        run: |
          cd bindings/java
          mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true


