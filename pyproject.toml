[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hknt"
version = "2.0.0"
description = "From-scratch LLM runtime and model format in Zig: zero-copy mmap, CPU/CUDA/Vulkan engines, 2:4 sparsity, Net2Net growth, in-file version history, self-learning loops."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Harshit Khandelwal", email = "harshitkhandelwal208@gmail.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# hk installs with no dependencies: the command line, the native engine, tokenizers, the downloader and the
# converters need nothing. NumPy and PyTorch are only for the Python tensor layers and are opt-in extras.
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.22.0"]
torch = ["torch>=2.0.0", "numpy>=1.22.0"]
all = ["torch>=2.0.0", "numpy>=1.22.0"]
dev = ["pytest", "torch>=2.0.0", "numpy>=1.22.0"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["hk*"]

[tool.setuptools.package-data]
hk = ["*.dll", "*.so", "*.dylib", "bin/*", "py.typed"]

[project.scripts]
hk = "hk.cli:main"
hk-gui = "hk.gui:main"

[project.urls]
Homepage = "https://github.com/harshitkhandelwal208/hk"
Documentation = "https://github.com/harshitkhandelwal208/hk#readme"
Repository = "https://github.com/harshitkhandelwal208/hk.git"
Issues = "https://github.com/harshitkhandelwal208/hk/issues"
Changelog = "https://github.com/harshitkhandelwal208/hk/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
pythonpath = ["python", "."]
testpaths = ["tests"]
